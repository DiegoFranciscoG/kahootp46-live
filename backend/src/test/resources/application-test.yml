# Placeholders required by application.yml. Real connections come from Testcontainers (@ServiceConnection);
# JWT_SECRET and ADMIN_PASSWORD are generated randomly per run in IntegrationTestSupport.
DB_URL: jdbc:postgresql://replaced-by-testcontainers/test
DB_USER: test
DB_PASSWORD: ${random.uuid}
REDIS_URL: redis://replaced-by-testcontainers:6379
CORS_ALLOWED_ORIGINS: http://localhost:4200
ADMIN_EMAIL: admin@kahootp46.test

app:
  rate-limit:
    connect-per-minute: 30
    login-per-minute: 1000
  game:
    deadline-poll-interval: 200

logging:
  level:
    org.testcontainers: WARN
    com.github.dockerjava: WARN
