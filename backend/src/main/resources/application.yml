spring:
  application:
    name: kahootp46-live
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      url: ${REDIS_URL}
  servlet:
    multipart:
      max-file-size: 256KB
      max-request-size: 300KB

server:
  port: ${APP_PORT:8080}
  forward-headers-strategy: native
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    jwt-secret: ${JWT_SECRET}
    admin-token-ttl: PT1H
    viewer-token-ttl: PT4H
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
  rate-limit:
    connect-per-minute: 30
    login-per-minute: 5
  game:
    snapshot-ttl: PT10M
    # milliseconds between checks for expired questions
    deadline-poll-interval: 500

logging:
  level:
    root: INFO
