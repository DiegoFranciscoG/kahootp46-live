name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalar gitleaks 8.30.1 (SHA-256 verificado)
        run: |
          curl -fsSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
      - name: Escanear historial completo
        run: ./gitleaks git . -c .gitleaks.toml --redact --verbose --exit-code 1

  backend:
    name: Backend (tests + Testcontainers + cobertura)
    runs-on: ubuntu-24.04
    needs: secrets
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Maven verify
        run: sh mvnw -B -ntp verify
      - name: Reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jacoco-report
          path: backend/target/site/jacoco
          retention-days: 7

  frontend:
    name: Frontend (Vitest + build)
    runs-on: ubuntu-24.04
    needs: secrets
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test -- --watch=false
      - run: npm run build

  e2e:
    name: E2E (Playwright sobre docker compose)
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Secretos efímeros para este job (nunca se imprimen)
        run: |
          {
            echo "DB_USER=kahootp46"
            echo "DB_PASSWORD=$(openssl rand -hex 16)"
            echo "REDIS_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "ADMIN_EMAIL=admin@kahootp46.local"
            echo "ADMIN_PASSWORD=$(openssl rand -hex 12)"
            echo "SPRING_PROFILES_ACTIVE=demo"
          } > .env
      - name: Levantar el stack
        run: docker compose up --build -d --wait --wait-timeout 300
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Instalar Playwright
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Ejecutar pruebas e2e
        working-directory: e2e
        run: |
          set -a; . ../.env; set +a
          npx playwright test
      - name: Reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
      - name: Logs del stack
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Apagar el stack
        if: always()
        run: docker compose down -v

  docker:
    name: Imágenes Docker
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend
        run: docker build -t kahootp46-backend:ci backend
      - name: Build frontend
        run: docker build -t kahootp46-frontend:ci frontend
      - name: Build imagen única de despliegue
        run: docker build -t kahootp46-live:ci .
