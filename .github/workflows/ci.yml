name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalar gitleaks 8.30.1 (SHA-256 verificado)
        run: |
          curl -fsSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
      - name: Escanear historial completo
        run: ./gitleaks git . -c .gitleaks.toml --redact --verbose --exit-code 1

  backend:
    name: Backend (tests + Testcontainers + cobertura)
    runs-on: ubuntu-24.04
    needs: secrets
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Maven verify
        run: sh mvnw -B -ntp verify
      - name: Reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco
          retention-days: 7

  frontend:
    name: Frontend (Vitest + build)
    runs-on: ubuntu-24.04
    needs: secrets
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test -- --watch=false
      - run: npm run build

  docker:
    name: Imágenes Docker
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend
        run: docker build -t kahootp46-backend:ci backend
      - name: Build frontend
        run: docker build -t kahootp46-frontend:ci frontend
